<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khaled Shams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone-width column over a slow aurora background. Hex logo and name, a glass support card, then glass link rows grouped as live, video and community. Sunset pink-to-orange accent with a small teal highlight. */
:root {
  --bg: #090812;
  --blob-a: rgba(255, 79, 139, .42);
  --blob-b: rgba(255, 154, 60, .30);
  --blob-c: rgba(46, 230, 197, .20);
  --glass: rgba(24, 21, 40, .66);
  --glass-hi: rgba(36, 31, 58, .82);
  --solid: #1a1730;
  --line: rgba(255, 255, 255, .10);
  --fg: #f5f3fc;
  --muted: #a39eba;
  --accent: #ff4f8b;
  --accent-2: #ff9a3c;
  --accent-3: #2ee6c5;
  --on-accent: #1c0610;
  --focus: #ffd166;
  --font: "Rubik", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f2fb; --blob-a: rgba(227, 48, 111, .22); --blob-b: rgba(217, 88, 10, .16); --blob-c: rgba(14, 170, 146, .14);
    --glass: rgba(255, 255, 255, .72); --glass-hi: rgba(255, 255, 255, .95); --solid: #f0eaf8;
    --line: rgba(40, 20, 80, .12); --fg: #1b1530; --muted: #655e80;
    --accent: #e3306f; --accent-2: #d9580a; --accent-3: #0a9e86; --on-accent: #ffffff; --focus: #b45309;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f2fb; --blob-a: rgba(227, 48, 111, .22); --blob-b: rgba(217, 88, 10, .16); --blob-c: rgba(14, 170, 146, .14);
  --glass: rgba(255, 255, 255, .72); --glass-hi: rgba(255, 255, 255, .95); --solid: #f0eaf8;
  --line: rgba(40, 20, 80, .12); --fg: #1b1530; --muted: #655e80;
  --accent: #e3306f; --accent-2: #d9580a; --accent-3: #0a9e86; --on-accent: #ffffff; --focus: #b45309;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  position: relative;
  overflow-x: clip;
  padding-block: 40px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* aurora */
.aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
.blob.a { width: 340px; height: 340px; background: var(--blob-a); top: -90px; right: -70px; animation: drift-a 22s ease-in-out infinite alternate; }
.blob.b { width: 300px; height: 300px; background: var(--blob-b); top: 240px; left: -110px; animation: drift-b 26s ease-in-out infinite alternate; }
.blob.c { width: 280px; height: 280px; background: var(--blob-c); bottom: -80px; right: -60px; animation: drift-a 30s ease-in-out infinite alternate-reverse; }
@keyframes drift-a { to { transform: translate(-60px, 70px) scale(1.12); } }
@keyframes drift-b { to { transform: translate(80px, -50px) scale(1.08); } }

.wrap { position: relative; max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }

/* header */
header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo { width: 112px; height: 112px; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 12px 30px var(--blob-a)); }
@keyframes float { 50% { transform: translateY(-5px); } }
.logo .hex { fill: url(#lg); stroke: url(#lg); stroke-width: 8; stroke-linejoin: round; }
.logo .shine { fill: #fff; opacity: .18; }
.logo text { fill: var(--on-accent); font-family: var(--font); font-weight: 800; font-size: 44px; letter-spacing: -1px; }
h1 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1; direction: ltr; text-wrap: balance; }
.handle { margin: 8px auto 0; display: inline-flex; align-items: center; gap: 8px; direction: ltr; color: var(--muted); font-size: 14px; font-weight: 500; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); }
.handle i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-3); box-shadow: 0 0 10px var(--accent-3); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; direction: ltr; }
.chips li { font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px; background: var(--solid); border: 1px solid var(--line); color: var(--fg); }

.glass { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

/* support */
.support { border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.support::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.s-head { display: flex; align-items: center; gap: 14px; }
.heart { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.heart svg { width: 24px; height: 24px; fill: currentColor; }
.s-head h2 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
.s-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.addr-row { display: flex; align-items: stretch; gap: 8px; }
.addr { flex: 1; min-width: 0; direction: ltr; text-align: left; font-weight: 500; font-size: 15px; background: var(--solid); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow-wrap: anywhere; user-select: all; }
.btn { min-height: 48px; padding: 10px 18px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 16px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s, filter .15s, background .15s; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); border: 0; }
.btn.ghost { background: var(--solid); color: var(--fg); border: 1px solid var(--line); flex: none; }
.btn:active { transform: scale(.98); }
@media (hover: hover) { .btn.primary:hover { filter: brightness(1.1); } .btn.ghost:hover { background: var(--glass-hi); } }
.btn:focus-visible, .row:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* groups */
.group { display: flex; flex-direction: column; gap: 10px; }
.group + .group { margin-top: 18px; }
.group h3 { margin: 0; padding-inline: 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.row { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 10px 14px; border-radius: 18px; color: var(--fg); text-decoration: none; transition: transform .15s, background .15s, border-color .15s, box-shadow .15s; }
.row:active { transform: scale(.985); }
@media (hover: hover) { .row:hover { background: var(--glass-hi); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 28px -12px var(--blob-a); } }
.tile { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; }
.tile svg { width: 24px; height: 24px; fill: currentColor; }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.name { font-weight: 700; font-size: 17px; line-height: 1.25; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.sub.ltr { direction: ltr; text-align: right; }
.chev { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--solid); color: var(--muted); font-size: 18px; line-height: 1; padding-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
body{margin:0}
</style>
<body>
<div class="aurora" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="شعار Khaled Shams">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--accent)"></stop>
          <stop offset="1" style="stop-color: var(--accent-2)"></stop>
        </linearGradient>
      </defs>
      <polygon class="hex" points="60,10 103,35 103,85 60,110 17,85 17,35"></polygon>
      <polygon class="shine" points="60,10 103,35 103,50 34,90 17,85 17,35"></polygon>
      <text x="60" y="76" text-anchor="middle">KS</text>
    </svg>
    <div>
      <h1>Khaled Shams</h1>
      <p class="handle"><i></i>@khaledshamsmo</p>
    </div>
    <ul class="chips" id="games" aria-label="الألعاب"></ul>
  </header>

  <section class="support glass" aria-labelledby="sup-title">
    <div class="s-head">
      <span class="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7.500-4.600-9.600-9.300C.9 8.200 2.800 4.500 6.500 4.500c2 0 3.500 1 4.500 2.500h2c1-1.500 2.500-2.500 4.500-2.500 3.700 0 5.600 3.700 4.100 7.200C19.500 16.400 12 21 12 21z"/></svg></span>
      <div>
        <h2 id="sup-title">ادعمني</h2>
        <p>تحويل عبر InstaPay لو بتحب المحتوى</p>
      </div>
    </div>
    <div class="addr-row">
      <div class="addr" id="addr">khaled_shamss@instapay</div>
      <button class="btn ghost" id="copy" type="button">نسخ</button>
    </div>
    <a class="btn primary" href="https://ipn.eg/S/khaled_shamss/instapay/7rpzeZ" target="_blank" rel="noopener noreferrer">حوّل عبر InstaPay</a>
  </section>

  <main id="groups"></main>
</div>
<script>
document.documentElement.lang = "ar";
document.documentElement.dir = "rtl";

var GAMES = ["GTA IV", "FC27", "RDR2", "Uncharted 4", "Wild Rift", "PUBG"];

var ICONS = {
  tiktok: '<path d="M16.500 3c.3 2.300 1.800 3.900 4 4.100v3.100c-1.500 0-2.900-.4-4-1.200v6.200a6 6 0 1 1-6-6c.3 0 .6 0 .9.100v3.200a2.900 2.900 0 1 0 2 2.700V3z"/>',
  kick: '<path d="M4 3h5v6l5.500-6H21l-7 8 7.500 10h-6.300L9 14.500V21H4z"/>',
  twitch: '<path fill-rule="evenodd" d="M4 3h17v11l-5 5h-4l-3 3v-3H4zm4 3v8h2V6zm5 0v8h2V6z"/>',
  youtube: '<path fill-rule="evenodd" d="M21.500 7.200a2.500 2.500 0 0 0-1.800-1.800C18.100 5 12 5 12 5s-6.100 0-7.700.4A2.500 2.500 0 0 0 2.500 7.200C2 8.800 2 12 2 12s0 3.200.5 4.800a2.500 2.500 0 0 0 1.800 1.800C5.900 19 12 19 12 19s6.100 0 7.700-.4a2.500 2.500 0 0 0 1.800-1.800c.5-1.600.5-4.800.5-4.800s0-3.200-.5-4.800zM10 15V9l5.200 3z"/>',
  discord: '<path fill-rule="evenodd" d="M7 5.500C8.600 4.800 10.200 4.500 12 4.500s3.400.3 5 1c2 3 3 6.200 3 10-1.500 1.300-3 2.100-4.500 2.600l-1-1.600c.8-.3 1.500-.6 2-1.100-1.200.6-2.800 1.100-4.500 1.100s-3.300-.5-4.500-1.100c.5.500 1.200.8 2 1.100l-1 1.600C5 17.600 3.500 16.800 2 15.500c0-3.800 1-7 3-10zM9 10.500a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3zm6 0a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3z"/>',
  instagram: '<path fill-rule="evenodd" d="M8 2h8a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6zm0 2a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V8a4 4 0 0 0-4-4zm4 3.500a4.500 4.500 0 1 1 0 9 4.500 4.500 0 0 1 0-9zm0 2a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5zM17.300 5.500a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400z"/>',
  facebook: '<path d="M14 8h2.800V4.500H14c-2.300 0-4 1.700-4 4V11H7.500v3.500H10V22h3.700v-7.500h2.700l.6-3.500h-3.300V9.200c0-.7.500-1.200 1.300-1.200z"/>'
};

/* Add or change a url here. Items with an empty url are not shown. */
var GROUPS = [
  { title: "بث مباشر", items: [
    { icon: "tiktok", name: "TikTok", sub: "@khaledshamsmo", ltr: true, url: "https://www.tiktok.com/@khaledshamsmo", bg: "#010101", fg: "#25f4ee" },
    { icon: "kick", name: "Kick", sub: "khaledshamsmo", ltr: true, url: "https://kick.com/khaledshamsmo", bg: "#53fc18", fg: "#0b0e0a" },
    { icon: "twitch", name: "Twitch", sub: "khaledshamsmo", ltr: true, url: "https://www.twitch.tv/khaledshamsmo", bg: "#9146ff", fg: "#ffffff" }
  ]},
  { title: "فيديوهات", items: [
    { icon: "youtube", name: "YouTube", sub: "@khaledshamsmo", ltr: true, url: "https://www.youtube.com/@khaledshamsmo", bg: "#ff0033", fg: "#ffffff" }
  ]},
  { title: "تواصل", items: [
    { icon: "discord", name: "Discord", sub: "انضم للسيرفر", url: "https://discord.gg/gRAscAagp", bg: "#5865f2", fg: "#ffffff" },
    { icon: "instagram", name: "Instagram", sub: "khaledshamsmo", ltr: true, url: "https://www.instagram.com/khaledshamsmo", bg: "linear-gradient(135deg,#feda75,#d62976 55%,#4f5bd5)", fg: "#ffffff" },
    { icon: "facebook", name: "Facebook", sub: "Khaled Shams", ltr: true, url: "https://www.facebook.com/share/1CS5ZuEPin/", bg: "#1877f2", fg: "#ffffff" }
  ]}
];

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

var chips = document.getElementById("games");
GAMES.forEach(function (g) { chips.appendChild(el("li", "", g)); });

var root = document.getElementById("groups");
GROUPS.forEach(function (g) {
  var items = g.items.filter(function (i) { return i.url; });
  if (!items.length) return;
  var sec = el("section", "group");
  sec.appendChild(el("h3", "", g.title));
  items.forEach(function (i) {
    var a = el("a", "row glass");
    a.href = i.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    var tile = el("span", "tile");
    tile.style.background = i.bg; tile.style.color = i.fg;
    tile.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[i.icon] + "</svg>";
    var t = el("span", "txt");
    t.appendChild(el("span", "name", i.name));
    if (i.sub) t.appendChild(el("span", "sub" + (i.ltr ? " ltr" : ""), i.sub));
    a.appendChild(tile); a.appendChild(t); a.appendChild(el("span", "chev", "‹"));
    sec.appendChild(a);
  });
  root.appendChild(sec);
});

var copyBtn = document.getElementById("copy");
copyBtn.addEventListener("click", function () {
  var addrEl = document.getElementById("addr");
  var done = function (msg) {
    copyBtn.textContent = msg;
    setTimeout(function () { copyBtn.textContent = "نسخ"; }, 2000);
  };
  var fallback = function () {
    var r = document.createRange(); r.selectNodeContents(addrEl);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    done("انسخه يدويًا");
  };
  try {
    navigator.clipboard.writeText(addrEl.textContent).then(function () { done("تم النسخ"); }, fallback);
  } catch (e) { fallback(); }
});
</script>

</body>
</html>
